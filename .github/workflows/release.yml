name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: claux
            asset_name: claux-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: claux
            asset_name: claux-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: claux
            asset_name: claux-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: claux.exe
            asset_name: claux-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Linux and macOS)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.binary_name }}

      - name: Rename binary for upload
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.asset_name }}

      - name: Write per-asset checksum
        shell: bash
        run: |
          sha256sum ${{ matrix.asset_name }} | tee ${{ matrix.asset_name }}.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  checksums:
    name: Publish SHA256SUMS
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download every release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'claux-*' \
            --dir assets
          rm -f assets/*.sha256

      # One file in sha256sum(1) format so consumers can run
      # `sha256sum --check --ignore-missing SHA256SUMS` next to the asset
      # they downloaded. The per-asset .sha256 files above are convenient
      # for scripts that fetch a single binary.
      - name: Write SHA256SUMS
        run: |
          (cd assets && sha256sum claux-*) | tee SHA256SUMS

      - name: Publish SHA256SUMS
        uses: softprops/action-gh-release@v2
        with:
          files: SHA256SUMS
